<style>

}

    --bg:#f4f2ee;--sf:#eae7e1;--ln:#d5d1c9;--tx:#0a0a0a;--mu:#6b6b6b;--sm:#b5b1a8;

  }
}

  --bg:#f4f2ee;--sf:#eae7e1;--ln:#d5d1c9;--tx:#0a0a0a;--mu:#6b6b6b;--sm:#b5b1a8;
  --ok:#4f8a3a;--no:#c0392b;--ice:#2b6f9e;--gd:#a8741a;--lv:#6d5bb5;

html,body{margin:0;background:var(--bg);overflow-x:hidden}
body{
  font:16px Inter,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  color:var(--tx);
  min-height:100vh;
  padding-top:env(safe-area-inset-top, 0px);
  padding-bottom:calc(84px + env(safe-area-inset-bottom, 0px));
}
.l{font:400 13px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
header{
  display:flex;justify-content:space-between;align-items:flex-end;
  padding:calc(14px + env(safe-area-inset-top,0px)) 20px 10px;
  position:sticky;top:0;z-index:5;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);

}
.brand{font:700 24px var(--dsp);letter-spacing:-.02em}
.big{font:700 88px/0.95 var(--dsp);letter-spacing:-.03em}

.rule{border-top:1px solid var(--ln)}
.hab,.btn,.ghost,.chip,.ico,.stp,.ledger[data-a]{transition:transform .15s,background .25s,opacity .2s;cursor:pointer}
.hab:active,.btn:active,.ghost:active,.chip:active,.ico:active,.stp:active{transform:scale(.96)}
.hab{display:flex;align-items:center;gap:12px;padding:18px 8px;border-bottom:1px solid var(--ln);min-height:68px}

.md.u{border-color:var(--gd)!important;background:color-mix(in srgb,var(--gd) 9%,var(--sf));color:var(--tx)}

  position:fixed;top:40%;left:50%;font:700 64px var(--mono);color:var(--ok);border:4px solid var(--ok);
  padding:6px 22px;transform:translate(-50%,-50%) rotate(-12deg);opacity:0;pointer-events:none;z-index:99;
}
#stamp.show{animation:st 1.6s ease-out}
@keyframes st{0%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(2.2)}15%{opacity:1;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}75%{opacity:1}100%{opacity:0}}
@keyframes pl{50%{opacity:.3}}.pulse{animation:pl 1.4s infinite}
.toast{
  position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:20px;right:20px;
  background:var(--ac);color:#000;padding:14px;font:14px var(--mono);z-index:100;
  text-align:center;border-radius:16px;box-shadow:0 10px 30px -10px rgba(0,0,0,.6);

}
.strip{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.dy{flex:none;width:54px;padding:10px 0;border:1px solid var(--ln);border-radius:16px;text-align:center;cursor:pointer;transition:.2s}

.dy.has i{background:var(--ok)}.dy.sel{background:var(--ac);color:#000;border-color:var(--ac)}
.dy.sel small{color:#000}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.tc{border:1px solid var(--ln);border-left:4px solid var(--c);border-radius:16px;padding:14px;cursor:pointer;background:var(--sf);transition:.2s}
.tc b{display:block;font-size:15px}.tc small{color:var(--mu);font:12px var(--mono)}
.tc.sel{background:color-mix(in srgb,var(--c) 18%,var(--sf))}.tc:active{transform:scale(.97)}
.ed{border:1px solid var(--ln);border-top:3px solid var(--c);border-radius:24px;padding:18px;margin:12px 0;background:var(--sf);box-shadow:0 10px 26px -16px rgba(0,0,0,.6)}
.q{display:flex;gap:12px;margin-top:16px}.q>span{font:13px var(--mono);color:var(--c);padding-top:3px}.qt{font-size:15px;color:var(--mu)}
.ed textarea{font:18px/1.6 var(--ser);border:0;border-bottom:1px solid var(--ln);min-height:72px;padding:6px 0;resize:none}
.mw{display:flex;gap:12px;margin:12px 0 8px}
.md5{width:38px;height:38px;border-radius:50%;background:color-mix(in srgb,var(--c) 30%,transparent);border:2px solid var(--c);cursor:pointer;transition:.2s}
.md5.sel{background:var(--c);transform:scale(1.18)}
.tl{border-left:1px solid var(--ln);margin:10px 0 0 6px}
.tli{display:flex;gap:12px;align-items:center;padding:14px 0;cursor:pointer;margin-left:-7px}
.tli .dot{width:13px;height:13px;border-radius:50%;flex:none}.tli>div{flex:1}
.qc{border-left:3px solid var(--gd);padding:6px 0 6px 16px;margin:18px 0}
.qq{font:italic 21px/1.4 var(--ser);margin:8px 0 12px}
::selection{background:var(--ac);color:#000}::placeholder{color:var(--sm)}
.pt{display:flex;align-items:center;gap:14px;margin:16px 0 6px}
.pt span{font:700 38px var(--dsp);letter-spacing:-.03em}
.pt i{flex:1;height:2px;background:linear-gradient(90deg,var(--ac),transparent)}
.fx>*{animation:up .45s both}
.fx>*:nth-child(n+3){animation-delay:.05s}
.fx>*:nth-child(n+5){animation-delay:.1s}
.fx>*:nth-child(n+8){animation-delay:.15s}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.hero{position:relative;display:flex;gap:14px;align-items:center;margin:10px 0 0;padding:16px;border:1px solid var(--ln);border-radius:26px;background:var(--sf)}
.hd{width:45%;flex:none}.hi{flex:1;min-width:0}
.hero .ico{position:absolute;top:10px;right:10px;width:38px;height:38px;font-size:17px}
.dsv{width:100%;display:block}
.sub{display:flex;justify-content:space-between;font:13px var(--mono);padding:14px 6px;cursor:pointer}
.sub span:last-child{color:var(--ac)}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 6px}
.sh b{font:700 24px var(--dsp);letter-spacing:-.02em}
.acc{border:1px solid var(--ln);border-radius:20px;margin:12px 0;background:var(--sf);overflow:hidden}
.ah{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;cursor:pointer}
.ah b{font-size:16px}.ab{padding:0 18px 16px}
.hero .tab i{width:14px;height:14px}
@media (prefers-reduced-motion:reduce){#stamp.show,.pulse,.pop .cir,.fx>*, .toast{animation:none}}
</style>
</head>
<body>
<div id="stamp">DONE</div>
<header>
  <div>
    <div class="brand" id="bn"></div>
    <div class="l" id="dl"></div>
  </div>
  <div style="display:flex;gap:8px">
    <button class="ghost" data-a="th" title="Toggle Theme">◐</button>

</header>
<main id="v"></main>
<nav id="nav"></nav>

<script>
let START="2026-09-22",END="2026-12-05",TOTAL=75,NAME="Winter Arc";
const CUR="₹",PAL=["#a99bd6","#86b6d8","#8fbf9f","#d9a06f","#d98f9f","#9aa5e0"];
const BASE=[
  ["aff","Positive Affirmation","#a99bd6"],
  ["cold","Cold Shower","#86b6d8"],
  ["diet","Follow Your Diet","#8fbf9f"],
  ["ex","Exercise","#d9a06f"],
  ["run","Outdoor Run / Walk","#d98f9f"],
  ["wake","Wake Before Sunrise","#9aa5e0"]
].map(a=>({id:a[0],n:a[1],c:a[2]}));
let H=BASE;

function applyCfg(){
  S.mk=S.mk||{};S.qs=S.qs||{};S.fav=S.fav||[];S.wt=S.wt||{};S.pr=S.pr||{};applyTh();
  const c=S.cfg||{};START=c.s||START;END=c.e||END;NAME=c.n||NAME;
  TOTAL=Math.max(1,Math.round((dt(END)-dt(START))/864e5)+1);
  H=BASE.concat((S.cx||[]).map((h,i)=>({id:h.id,n:h.n,c:PAL[i%6]})));
  Object.keys(S.j).forEach(d=>{const j=S.j[d];if(j.tpl){S.j[d]={mood:j.mood,t:{[j.tpl]:{f:j.f}},u:Date.now()}}});
}

function dlabel(){
  const n=dayN(today());
  return NAME.toUpperCase()+" · "+(n<1?"STARTS "+START:n>TOTAL?"COMPLETE":"DAY "+n+"/"+TOTAL);
}

const TPL={
  "Morning Intent":["Top 3 goals today","Affirmation","3 things I'm grateful for","Energy level (1-5)"],
  "Evening Reflection":["Wins today","Lessons learned","What I'd change","Sleep hours / water"],
  "Money Mindset":["Spending decisions today","Any unnecessary expense?","Lesson","Plan for tomorrow"],
  "Free Write":["Write freely…"]
};
const TC={"Morning Intent":"#d9b26f","Evening Reflection":"#a99bd6","Money Mindset":"#86b6d8","Free Write":"#8fbf9f"},
      MC=["#e07a6f","#d9a06f","#d9b26f","#9ccf8a","#86b6d8"],
      ML=["LOW","MEH","OK","GOOD","GREAT"];
const Q="Discipline is just a promise you keep to yourself.|Do the hard thing first; the day gets lighter.|You do not need motivation, you need a start.|One percent better today is a whole new person in a year.|Winter is where the strong are built quietly.|Show up tired. Show up anyway.|Your future self is watching what you do right now.|Comfort is a slow way to lose.|Every tick you mark is a vote for who you are becoming.|Consistency beats intensity every single time.|Be the person who finishes what they start.|The sunrise rewards those who meet it.|Pain is temporary, regret is a long winter.|Start where you are, use what you have, do what you can.|Progress is quiet before it is visible.|You are one habit away from a different life.|Do not wait to feel ready; get ready by doing.|The best mood-lifter is a promise kept.|Small wins stack into big changes.|Today's effort is tomorrow's ease.|Be stubborn about your goals and flexible about your methods.|Nobody is coming to save your day; that is your superpower.|A slow day is still a day forward.|Fall seven times, rise with a plan.|Your only competition is yesterday's version of you.|Energy follows action.|Train your mind like you train your body: daily.|Discomfort is the price of growth; pay it gladly.|Make it simple, make it daily, make it count.|You are not behind; you are building.|Let your routine be your rocket.|Choose the harder right over the easier wrong.|Each morning is a clean page; write something brave.|Doubt fades when the work begins.|Focus on the next rep, not the whole mountain.|Strength is built in the moments you wanted to quit.|Rest if you must, but never forget your reason.|Habits are the compound interest of self-improvement.|Be proud of showing up, especially when nobody sees.|The obstacle is the path.|Gratitude turns enough into plenty.|Money follows discipline, not wishes.|Track it, respect it, grow it.|Spend like your future depends on it, because it does.|A rupee saved is a seed planted.|Wealth is built in the boring days.|Do not save what is left after spending; spend what is left after saving.|Your habits are quietly writing your bank balance.|Calm mind, clear goals, steady steps.|Write it down; ideas fade, ink stays.|Be kind to yourself and hard on your excuses.|The world changes when you keep a small promise every day.|Trust the process; the results are on their way.|A cold start makes for a warm finish.|Breathe, reset, begin again.|You have survived every hard day so far.|Make today so good that tomorrow has to work hard.|Turn 'I should' into 'I did'.|Ordinary effort, repeated, becomes extraordinary.|Your body hears everything your mind says; speak kindly.|Move your body, and your mind will follow.|Do not count the days; make the days count.|Growth begins at the edge of comfort.|Little by little is a great distance.|Be patient; even mountains were built grain by grain.|Stop negotiating with your alarm clock.|Clean food, clear head, strong day.|Sweat now, shine later.|What you repeat, you become.|You are allowed to be a work in progress and a masterpiece at once.|The quiet hours belong to those who claim them.|Fear is just excitement without a plan.|Make your streak too precious to break.|Finish the day proud, not perfect.|A journal is a friend that remembers your growth.|Success is a daily ritual, not a lucky day.|Look how far you have come, then go further.|Great things take time; time takes consistency.|Choose progress over perfection.|Every expert was once a beginner who kept going.|Your effort today is a gift to your future.|Break the big goal into a Tuesday-sized task.|Silence the noise; hear your own purpose.|Courage is doing it while your hands still shake.|Winter tests the seeds that spring will celebrate.|Wake up with a plan and sleep with peace.|Nothing changes if nothing changes; change one thing today.|Keep going: the version of you at the finish line is worth it.|Your mindset is the first thing you train each day.|End the day with gratitude and begin with intention.".split("|");
const MK=["✓","×","●","★","🔥","💪","✅","❄️","⚡","🌟","🏆","❤️","☀️","🧊","🌱","💎"];
const mk=id=>S.mk[id]||"×";

function quote(){
  const t=today();
  if(S.qs[t]==null){
    let u=new Set(Object.values(S.qs)),p=Q.map((_,i)=>i).filter(i=>!u.has(i));
    if(!p.length){S.qs={};p=Q.map((_,i)=>i)}
    S.qs[t]=p[Math.floor(Math.random()*p.length)];
    save();
  }
  return Q[S.qs[t]];
}

function applyTh(){
  if(S.th&&S.th!="auto")document.documentElement.dataset.theme=S.th;
  else delete document.documentElement.dataset.theme;
}

const CATS=["Food","Transport","Rent","Bills","Health","Shopping","Learning","Fun","Savings","Stocks/MF","Gold/Crypto","Salary","Freelance","Other"];
const RANKS=[[0,"SNOWFLAKE"],[100,"FROSTBITE"],[300,"ICE WALKER"],[700,"BLIZZARD"],[1400,"GLACIER"],[2500,"ARCTIC LEGEND"]];
let S={h:{},tx:[],j:{},w:{}},V={tab:"home",tpl:"Morning Intent",mood:3,tt:"Expense"};
try{S=Object.assign(S,JSON.parse(localStorage.getItem("wa3")||"{}"))}catch(_){}
const save=()=>{try{localStorage.setItem("wa3",JSON.stringify(S))}catch(_){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const dt=s=>new Date(s+"T00:00:00"),add=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return iso(d)};
const today=()=>iso(new Date()),dayN=s=>Math.round((dt(s)-dt(START))/864e5)+1;
const done=(id,d)=>(S.h[d]||[]).includes(id),cnt=d=>(S.h[d]||[]).length,pad=n=>String(n).padStart(2,"0");
const m=n=>CUR+Math.round(n).toLocaleString("en-IN"),buzz=n=>{try{if(navigator.vibrate)navigator.vibrate(n)}catch(_){}};

function streak(id){
  let d=today();
  if(!done(id,d))d=add(d,-1);
  let n=0;
  while(done(id,d)){n++;d=add(d,-1)}
  return n;
}

const mon=s=>{const d=dt(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
function weeks(){
  const o={};
  S.tx.forEach(t=>{
    const k=mon(t.d),w=o[k]=o[k]||{w:k,inc:0,exp:0,inv:0,cat:{}};
    if(t.t=="Income")w.inc+=t.a;
    else if(t.t=="Investment")w.inv+=t.a;
    else{w.exp+=t.a;w.cat[t.c]=(w.cat[t.c]||0)+t.a}
  });
  return Object.values(o).sort((a,b)=>a.w<b.w?1:-1);
}

function stats(){
  const days=Object.keys(S.h);let xp=0,perfect=0;
  days.forEach(d=>{const c=cnt(d);xp+=c*10;if(c==H.length){xp+=30;perfect++}});
  const jd=Object.keys(S.j).length;xp+=jd*15;
  xp+=Object.values(S.wt||{}).reduce((a,v)=>a+Math.min(v,8)*2,0)+Object.values(S.pr||{}).reduce((a,r)=>a+r.filter(z=>z.d).length*5,0);
  const td=new Set(S.tx.map(t=>t.d));xp+=td.size*15;
  const ws=weeks();xp+=ws.length*10;
  const sv=ws.filter(w=>w.exp>0&&w.inc>w.exp+w.inv).length,c=id=>days.filter(d=>done(id,d)).length;
  const hy=Object.values(S.wt||{}).filter(v=>v>=8).length,pl=Object.values(S.pr||{}).filter(a=>a.length&&a.every(z=>z.d)).length;
  return{hy,pl,xp,perfect,jd,td:td.size,sv,cold:c("cold"),wake:c("wake"),inv:S.tx.filter(t=>t.t=="Investment").length,bs:Math.max(0,...H.map(h=>streak(h.id)))};
}

  ["PERFECT DAY",s.perfect,1,"★"],["PERFECT ×10",s.perfect,10,"★"],["EARLY BIRD",s.wake,10,"◐"],["ICE WARRIOR",s.cold,30,"❄"],
  ["FIRST PAGE",s.jd,1,"✎"],["STORY KEEPER",s.jd,30,"❡"],["INVESTOR",s.inv,1,"↗"],["MONEY MONK",s.td,7,"◎"],
  ["HYDRATED",s.hy,7,"💧"],["PLANNER",s.pl,5,"☑"],["WEEKLY SAVER",s.sv,1,"₹"]
];

function rank(xp){
  let r=0;RANKS.forEach((x,i)=>{if(xp>=x[0])r=i});
  const n=RANKS[r+1];
  return{name:RANKS[r][1],from:RANKS[r][0],next:n?n[0]:null};
}

const seg=(xp,rk)=>{
  const p=rk.next?(xp-rk.from)/(rk.next-rk.from):1;
  return`<div class="seg">${Array.from({length:10},(_,i)=>`<i class="${i<Math.round(p*10)?"f":""}"></i>`).join("")}</div>`;
};

function toast(t){
  const e=document.createElement("div");e.className="toast";e.textContent=t;
  document.body.appendChild(e);setTimeout(()=>e.remove(),2200);
}

const stCol=(d,n,i)=>i>n?"var(--sm)":cnt(d)==H.length?"var(--ok)":cnt(d)>0?"var(--lv)":i==n?"var(--tx)":"var(--no)";

function dial(){
  const t=today(),n=dayN(t);let s="";
  for(let i=1;i<=TOTAL;i++){
    const d=add(START,i-1),a=(i-1)/TOTAL*2*Math.PI-Math.PI/2,c=Math.cos(a),y=Math.sin(a),f=i>n,r1=f?130:122,r2=f?136:140;
    s+=`<line x1="${150+r1*c}" y1="${150+r1*y}" x2="${150+r2*c}" y2="${150+r2*y}" stroke="${stCol(d,n,i)}" stroke-width="${f?2:3}" ${i==n?'class="pulse"':""}/>`;
  }
  const dd=Math.min(Math.max(n,1),TOTAL);
  return`<svg class="dsv" viewBox="0 0 300 300"><circle cx="150" cy="150" r="112" fill="none" stroke="var(--ln)" stroke-width="1.5"/>${s}<text x="150" y="168" text-anchor="middle" fill="var(--tx)" font-family="Space Grotesk,sans-serif" font-weight="700" font-size="76" letter-spacing="-3">${dd}</text><text x="150" y="196" text-anchor="middle" fill="var(--mu)" font-family="JetBrains Mono,monospace" font-size="10" letter-spacing="1.5">OF ${TOTAL}</text></svg>`;
}

function tog(id,d){
  const a=S.h[d]=S.h[d]||[],i=a.indexOf(id);
  buzz(12);
  if(i>=0)a.splice(i,1);
  else{
    a.push(id);
    if(a.length==H.length&&d==today()){
      const s=document.getElementById("stamp");
      s.classList.remove("show");void s.offsetWidth;s.classList.add("show");
      buzz([30,40,30]);

/* Universal File Download Helper */
function downloadFile(filename, data, mimeType){
  try {
    const blob = data instanceof Blob ? data : new Blob([data], {type: mimeType || 'application/octet-stream'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 1500);
    return true;
  } catch(e) {
    console.error("Download error:", e);
    return false;
  }
}

const CP=["#a99bd6","#86b6d8","#8fbf9f","#d9a06f","#d98f9f","#9aa5e0","#d9b26f","#9ccf8a","#e07a6f","#7fc4c0"],hexA=h=>"FF"+h.replace("#","").toUpperCase();

function cv(w,h,t){
  const c=document.createElement("canvas");c.width=w*2;c.height=h*2;
  const x=c.getContext("2d");x.scale(2,2);x.fillStyle="#111114";x.fillRect(0,0,w,h);
  x.fillStyle="#fff";x.font="700 20px sans-serif";x.textAlign="left";x.fillText(t,20,32);
  return[c,x];
}

function barC(t,labels,series,cols,fmt,names){
  const w=610,h=320,[c,x]=cv(w,h,t),L=52,T=54,B=names?70:50,pw=w-L-16,ph=h-T-B,mx=Math.max(1,...series.flat())*1.12;
  x.font="12px sans-serif";x.strokeStyle="#2c2c33";
  for(let i=0;i<=4;i++){const y=T+ph-ph*i/4;x.beginPath();x.moveTo(L,y);x.lineTo(w-16,y);x.stroke();x.fillStyle="#9d9dab";x.textAlign="right";x.fillText(fmt(mx*i/4),L-8,y+4)}
  const gw=pw/Math.max(1,labels.length),bw=Math.min(46,gw*.72/series.length),step=Math.ceil(labels.length/12);
  labels.forEach((lb,i)=>{
    const cx=L+gw*i+gw/2;
    series.forEach((se,k)=>{
      const v=se[i],bh=ph*v/mx,xx=cx-bw*series.length/2+bw*k;
      x.fillStyle=series.length==1&&cols.length>1?cols[i%cols.length]:cols[k];
      x.fillRect(xx+1,T+ph-bh,bw-2,bh);
      if(labels.length<=10&&v>0){x.fillStyle="#fff";x.textAlign="center";x.fillText(fmt(v),xx+bw/2,T+ph-bh-6)}
    });
    if(i%step==0){x.fillStyle="#9d9dab";x.textAlign="center";x.fillText(String(lb).slice(0,11),cx,T+ph+18)}
  });
  if(names)names.forEach((n,k)=>{x.fillStyle=cols[k];x.fillRect(L+k*110,h-26,12,12);x.fillStyle="#fff";x.textAlign="left";x.fillText(n,L+k*110+18,h-15)});
  return c.toDataURL("image/png");
}

function pieC(t,labels,values,fmt){
  const w=610,h=320,[c,x]=cv(w,h,t),tot=values.reduce((a,b)=>a+b,0);
  if(!tot){
    x.fillStyle="#9d9dab";x.font="16px sans-serif";x.fillText("No expenses logged yet",20,h/2);
  }else{
    let a0=-Math.PI/2;
    values.forEach((v,i)=>{
      const a1=a0+v/tot*2*Math.PI;x.beginPath();x.moveTo(150,182);x.arc(150,182,110,a0,a1);x.closePath();
      x.fillStyle=CP[i%10];x.fill();a0=a1;
    });
    x.beginPath();x.arc(150,182,58,0,7);x.fillStyle="#111114";x.fill();
    x.fillStyle="#fff";x.font="700 15px sans-serif";x.textAlign="center";x.fillText(fmt(tot),150,187);
    x.textAlign="left";x.font="13px sans-serif";
    labels.forEach((lb,i)=>{
      const y=70+i*24;x.fillStyle=CP[i%10];x.fillRect(300,y-11,13,13);x.fillStyle="#fff";
      x.fillText(lb+"  "+fmt(values[i])+" · "+Math.round(values[i]/tot*100)+"%",322,y);
    });
  }
  return c.toDataURL("image/png");
}

  cs(aw,4,0,1);

async function exp(){
  toast("BUILDING REPORT…");
  try{
    if(typeof ExcelJS=="undefined")return toast("EXCEL LIBRARY NOT LOADED");
    const wb=await buildWb(),buf=await wb.xlsx.writeBuffer();

    const ok = downloadFile(fname, blob);
    if(ok) toast("EXCEL REPORT SAVED");
    else toast("EXPORT FAILED");
  }catch(e){
    console.error(e);
    toast("EXPORT FAILED");

function grab(){
  document.querySelectorAll("textarea[data-q]").forEach(t=>{
    const k=(V.jd||today())+"|"+V.tpl;V.dr=V.dr||{};
    (V.dr[k]=V.dr[k]||{})[t.dataset.q]=t.value;
  });
}

document.addEventListener("click",e=>{
  const x=e.target.closest("[data-a]");
  if(!x)return;
  const a=x.dataset.a,id=x.dataset.id,g=i=>document.getElementById(i);
  if(V.tab=="log")grab();
  V.last=null;
  if(a=="tab")V.tab=id;
  else if(a=="tog"){V.last=id;tog(id,today())}
  else if(a=="cell"){if(x.dataset.d<=today())tog(id,x.dataset.d)}
  else if(a=="tt")V.tt=id;
  else if(a=="tpl")V.tpl=id;
  else if(a=="mood")V.mood=+id;
  else if(a=="del"){S.tx=S.tx.filter(t=>t.id!=id);save()}
  else if(a=="addtx"){
    const v=parseFloat(g("amt").value);
    if(!(v>0))return toast("ENTER AMOUNT");
    S.tx.push({id:Date.now(),d:g("ed").value||today(),t:V.tt,c:g("cat").value,a:v,n:g("note").value});
    save();toast("SAVED · +15 XP");
  }
  else if(a=="rc"){V.rc=id}
  else if(a=="rs"){V.rd=add(V.rd||today(),+id*(V.rc=="week"?7:1))}
  else if(a=="eb"){V.eb=!V.eb}
  else if(a=="sb"){
    const v=parseFloat(g("ob").value);
    if(isNaN(v))return toast("ENTER BALANCE");
    S.ob=v-S.tx.reduce((q,t)=>q+(t.t=="Income"?t.a:-t.a),0);
    V.eb=false;save();toast("BALANCE SET");
  }
  else if(a=="jd"){
    V.jd=id==today()?null:id;
    V.mood=(S.j[id]||{mood:3}).mood;
    V.tab="log";
    if(x.classList.contains("tli"))scrollTo(0,0);
  }
  else if(a=="jt"){V.jd=null;V.mood=(S.j[today()]||{mood:3}).mood}
  else if(a=="savej"){
    const d=V.jd||today(),en=S.j[d]=S.j[d]||{t:{}};
    en.mood=V.mood;
    Object.keys(V.dr||{}).filter(k=>k.startsWith(d+"|")).forEach(k=>{
      const n=k.split("|")[1],f=V.dr[k];
      if(Object.values(f).some(v=>v.trim()))en.t[n]={f};
      else delete en.t[n];
      delete V.dr[k];
    });
    if(!Object.keys(en.t).length)delete S.j[d];
    else{
      en.u=Date.now();
      const mi=(en.t["Morning Intent"]||{f:{}}).f;
      if(d==today()&&mi[1]&&mi[1].trim()&&!done("aff",d))tog("aff",d);
    }
    save();toast("SAVED TO "+d+" FILE");
  }
  else if(a=="sd"){V.sd=!V.sd}
  else if(a=="savesd"){
    const v=g("sd").value;
    if(!v)return toast("PICK A DATE");
    S.cfg={s:v,e:add(v,TOTAL-1),n:NAME};
    applyCfg();save();V.sd=false;toast("TODAY IS DAY "+dayN(today()));
  }
  else if(a=="ac"){V.ac=V.ac||{};V.ac[id]=!V.ac[id]}
  else if(a=="cf"){V.cf=!V.cf}
  else if(a=="mh"){V.mh=id}
  else if(a=="sm"){S.mk[V.mh||H[0].id]=id;save()}
  else if(a=="cm"){
    const v=g("cmv").value.trim();
    if(!v)return toast("TYPE ANY EMOJI OR SYMBOL");
    let c;try{c=[...new Intl.Segmenter().segment(v)][0].segment}catch(_){c=Array.from(v)[0]}
    S.mk[V.mh||H[0].id]=c;save();
  }
  else if(a=="fav"){
    const q=S.qs[today()],i=S.fav.indexOf(q);
    if(i>=0)S.fav.splice(i,1);else S.fav.push(q);
    save();
  }
  else if(a=="wp"){S.wt[today()]=Math.min(20,(S.wt[today()]||0)+1);buzz(10);save()}
  else if(a=="wm"){S.wt[today()]=Math.max(0,(S.wt[today()]||0)-1);save()}
  else if(a=="ap"){
    const v=g("np").value.trim();if(!v)return;
    (S.pr[today()]=S.pr[today()]||[]).push({t:v,d:false});save();
  }
  else if(a=="tp"){const z=S.pr[today()][+id];z.d=!z.d;buzz(12);save()}
  else if(a=="dp"){S.pr[today()].splice(+id,1);save()}
  else if(a=="sbud"){S.bud=parseFloat(g("bd").value)||0;save();toast("BUDGET SET")}
  else if(a=="th"){
    S.th={auto:"light",light:"dark"}[S.th||"auto"]||"auto";
    applyTh();save();toast("THEME: "+(S.th||"auto").toUpperCase());
  }
  else if(a=="rst"){
    try{
      const o=JSON.parse(g("rj").value);
      S=Object.assign({h:{},tx:[],j:{},w:{}},o);
      applyCfg();save();toast("RESTORED");
    }catch(_){return toast("INVALID BACKUP")}
  }
  else if(a=="bk")return bk();
  else if(a=="addh"){
    const n=g("ch").value.trim();
    if(!n)return toast("ENTER HABIT NAME");
    (S.cx=S.cx||[]).push({id:"h"+Date.now(),n});
    applyCfg();save();
  }
  else if(a=="delh"){S.cx=(S.cx||[]).filter(h=>h.id!=id);applyCfg();save()}
  else if(a=="savecfg"){
    const s0=g("cs").value,e0=g("ce").value;
    if(!s0||!e0||e0<s0)return toast("END MUST BE AFTER START");
    S.cfg={s:s0,e:e0,n:g("cn").value.trim()||"Winter Arc"};
    applyCfg();save();V.cf=false;toast("CHALLENGE UPDATED · "+TOTAL+" DAYS");
  }
  else if(a=="exp")return exp();
  render();
});

document.addEventListener("input",e=>{
  const i=e.target.id;
  if(i!="sd"&&i!="sn")return;
  const g=x=>document.getElementById(x);let v;
  if(i=="sn"){
    const q=parseInt(g("sn").value);if(!(q>0))return;
    v=add(today(),-(q-1));g("sd").value=v;
  }else v=g("sd").value;
  if(!v)return;
  const n=Math.round((dt(today())-dt(v))/864e5)+1;
  if(i=="sd")g("sn").value=Math.max(n,1);
  g("pv").textContent="Today = Day "+n+" of "+TOTAL+" · starts "+v;
});

document.addEventListener("change",e=>{
  const w=e.target.dataset.w;
  if(w){S.w[w]=e.target.value;save()}
});

/* Android hardware back button handler */
window.addEventListener("popstate",()=>{
  if(V.cf || V.sd || V.eb){
    V.cf=false;V.sd=false;V.eb=false;render();
  }else if(V.tab!=="home"){
    V.tab="home";render();
  }
});

applyCfg();
render();
</script>
